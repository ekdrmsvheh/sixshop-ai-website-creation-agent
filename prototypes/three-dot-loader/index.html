<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>세 점 로더 프로토타입</title>
    <style>
      :root {
        --button-size: 38px;
        --icon-size: 24px;
        --border-color: #e3e4e9;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .scroll-button {
        display: grid;
        width: var(--button-size);
        min-width: var(--button-size);
        min-height: var(--button-size);
        place-items: center;
        border: 1px solid var(--border-color);
        border-radius: 50%;
        background: #fff;
      }

      .loading-icon { display: block; width: var(--icon-size); height: var(--icon-size); }

      .loading-icon circle {
        transform-box: fill-box;
        transform-origin: center;
        animation-duration: 1s;
        animation-timing-function: cubic-bezier(.37, 0, .63, 1);
        animation-iteration-count: infinite;
      }

      .loading-icon circle:nth-child(1) { animation-name: dot-wave-first; }
      .loading-icon circle:nth-child(2) { animation-name: dot-wave-second; }
      .loading-icon circle:nth-child(3) { animation-name: dot-wave-third; }

      @keyframes dot-wave-first {
        0%, 35%, 100% { transform: translateY(0); opacity: .3; }
        12% { transform: translateY(-1.5px); opacity: .65; }
        24% { transform: translateY(1.5px); opacity: 1; }
      }

      @keyframes dot-wave-second {
        0%, 15%, 51%, 100% { transform: translateY(0); opacity: .3; }
        27% { transform: translateY(-1.5px); opacity: .65; }
        39% { transform: translateY(1.5px); opacity: 1; }
      }

      @keyframes dot-wave-third {
        0%, 30%, 66%, 100% { transform: translateY(0); opacity: .3; }
        42% { transform: translateY(-1.5px); opacity: .65; }
        54% { transform: translateY(1.5px); opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .loading-icon circle { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="scroll-button" role="status" aria-label="AI가 응답을 생성하는 중">
      <svg class="loading-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="4" cy="12" r="2.5" fill="#85878E" />
        <circle cx="12" cy="12" r="2.5" fill="#85878E" />
        <circle cx="20" cy="12" r="2.5" fill="#85878E" />
      </svg>
    </div>
  </body>
</html>
